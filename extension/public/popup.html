<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FloatPilot</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            background: #0f0f0f;
            width: 300px;
            padding: 16px;
        }

        .user {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .user img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .username {
            font-size: 1.1em;
            font-weight: bold;
            color: white;
        }

        .badge {
            margin-top: 2px;
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75em;
            border-radius: 4px;
            color: black;
            background: #808080;
            font-weight: bold;
        }

        .section {
            margin-top: 16px;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 1.1em;
            color: white;
        }

        .setting {
            background: #1f1f1f;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting.locked {
            opacity: 0.4;
            pointer-events: none;
        }

        .setting-text {
            font-weight: 550;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #555;
            border-radius: 4px;
            background: transparent;
        }

        .checkbox.checked {
            background: white;
        }

        .profit-input {
            width: 60px;
            padding: 4px 6px;
            border: 2px solid #555;
            border-radius: 6px;
            background: #000;
            font-weight: bold;
            color: #fff;
            text-align: center;
        }

        .locked-group {
            position: relative;
        }

        .locked-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            background: rgba(128, 128, 128, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
        }

        .locked-overlay span {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .upgrade-btn {
            padding: 10px 16px;
            font-weight: 700;
            color: white;
            border-radius: 8px;
            background: #000000;
            border: none;
            cursor: pointer;
        }

        .upgrade-btn:hover {
            background: #0068ff;
            color: black;
            transition: ease 0.5s;
        }

        .footer {
            font-size: 0.75em;
            text-align: left;
            margin-top: 16px;
            opacity: 0.6;
            display: flex;
            justify-content: space-between;
        }

        #loginBtn {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            background: #1b2838;
            border: none;
            color: white;
            cursor: pointer;
            display: none;
        }

        #loginBtn:hover {
            background: #2e3d52;
        }
    </style>
</head>
<body>

<div class="user">
    <img id="avatar" src="" alt="Avatar" />
    <div>
        <div id="username" class="username">Loading…</div>
        <div id="plan" class="badge">...</div>
    </div>
</div>

<button id="loginBtn">Log In with Steam</button>

<div class="section">
    <div class="section-title">Settings</div>

    <div class="setting" data-key="removeTopSeller">
        <div class="setting-text">Remove Top Rated Seller</div>
        <div class="checkbox"></div>
    </div>

    <div class="setting" data-key="cheapestToggle">
        <div class="setting-text">Show Cheapest Listing</div>
        <div class="checkbox"></div>
    </div>
    <div class="setting" data-key="floatHighlight">
        <div class="setting-text">Highlight extreme floats</div>
        <div class="checkbox"></div>
    </div>
    <div class="locked-group">
        <div class="setting locked" data-key="itemEstimation">
            <div class="setting-text">Advanced Estimation</div>
            <div class="checkbox"></div>
        </div>
        <div class="setting" id="configSelectorSetting" style="display: none;">
            <div class="setting-text">Select Config</div>
            <select id="configDropdown" class="profit-input" style="width: 100%; padding: 6px; margin-top: 6px;"></select>
        </div>

        <div class="setting locked" data-key="profitTarget">
            <div class="setting-text">Desired profit (%)</div>
            <input id="profitInput" class="profit-input" type="number" min="0" max="100" step="1" placeholder="10" />
        </div>
        <div class="setting locked" data-key="bargainHelper">
            <div class="setting-text">Bargain Helper</div>
            <div class="checkbox"></div>
        </div>
        <div class="locked-overlay">
            <span>Pro required</span>
            <button class="upgrade-btn">Upgrade to Pro</button>
        </div>
    </div>
</div>

<div class="footer">
    <div>v0.9.0</div>
    <div class="badge" id="footerTier">Free</div>
</div>

<script src="popup.js" type ="module"></script>
</body>
</html>
