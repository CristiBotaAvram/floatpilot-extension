<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FloatPilot Popup</title>
    <style>
        body {
            font-family: 'system-ui', sans-serif;
            margin: 0;
            padding: 16px;
            width: 280px;
            background: linear-gradient(to bottom, #0a1434, #0e1a3f);
            color: #fff;
            border-radius: 20px;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: bold;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #182249;
            padding: 10px;
            margin-top: 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        .toggle-row.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .toggle-row .label {
            flex: 1;
        }

        .toggle-row input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            background: #000;
            border: 1px solid #fff;
            position: relative;
        }

        .toggle-row input[type="checkbox"]:checked {
            background: #fff;
        }

        .upgrade {
            margin-top: 8px;
            background: #5c6eff;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-top: 20px;
            color: #ccc;
        }

        .badge {
            background: #444;
            border-radius: 10px;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
<h3>FloatPilot</h3>

<div class="user-info">
    <img src="https://steamcdn-a.akamaihd.net/steamcommunity/public/images/avatars/00/0000000000000000000000000000000000000000_full.jpg" alt="Avatar" class="avatar" id="avatar">
    <div class="user-details">
        <div class="user-name" id="username">Username</div>
        <div id="plan">Cadet</div>
    </div>
</div>

<div class="toggle-row">
    <div class="label">Show Cheaper Alternatives</div>
    <input type="checkbox" id="toggle-cheaper" />
</div>
<div class="toggle-row">
    <div class="label">Other Settings</div>
    <input type="checkbox" id="toggle-other" checked />
</div>

<div class="toggle-row disabled">
    <div class="label">Other Settings</div>
    <input type="checkbox" />
</div>
<div style="margin-top: 4px; text-align: center; font-size: 13px; color: #ccc;">
    Co-Pilot subscription required
</div>

<div class="upgrade" id="upgradeBtn">Upgrade Now</div>

<div class="footer">
    <div>v0.9.0</div>
    <div class="badge">Cadet</div>
</div>

<script src="popup.js"></script>
</body>
</html>
