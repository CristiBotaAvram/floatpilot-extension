<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Orders – FloatPilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-white font-sans">
<header class="flex justify-between items-center px-6 py-4 bg-[#0f0f0f] border-b border-white">
    <h1 class="text-xl font-bold">FloatPilot Orders</h1>
    <a href="/" class="text-blue-400 hover:underline">← Back to Dashboard</a>
</header>

<main class="max-w-4xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-semibold mb-4">Your Purchase History</h2>
    <div id="ordersContainer" class="space-y-4">
        <!-- Orders will be injected here by JavaScript -->
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('ordersContainer');

        try {
            const res = await fetch('/api/orders');
            const data = await res.json();

            if (!data || !Array.isArray(data.orders)) {
                container.innerHTML = '<p class="text-gray-400">No orders found.</p>';
                return;
            }

            if (data.orders.length === 0) {
                container.innerHTML = '<p class="text-gray-400">You haven\'t made any purchases yet.</p>';
                return;
            }

            data.orders.forEach(order => {
                const div = document.createElement('div');
                div.className = 'border border-gray-700 rounded p-4 bg-[#1a1a1a]';
                div.innerHTML = `
            <h3 class="text-lg font-bold mb-1">${order.tier} Plan</h3>
            <p class="text-sm text-gray-400">Order ID: ${order.id}</p>
            <p class="text-sm">Price: ${order.amount} FF</p>
            <p class="text-sm">Date: ${new Date(order.created_at).toLocaleString()}</p>
          `;
                container.appendChild(div);
            });
        } catch (err) {
            console.error('Failed to load orders:', err);
            container.innerHTML = '<p class="text-red-400">Error loading orders.</p>';
        }
    });
</script>
</body>
</html>
