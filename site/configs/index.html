<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloatPilot Configs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- Confirmation Modal -->
<div id="confirmationModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden z-50">
    <div class="relative bg-[#1f1f1f] p-6 rounded-lg shadow-lg w-full max-w-sm text-center">
        <button id="closeModal" class="absolute top-2 left-2 text-white text-lg font-bold">✕</button>
        <h2 class="text-xl font-bold mb-2">Confirm Subscription</h2>
        <p id="confirmationText" class="mb-4 text-gray-300">Slide to confirm your subscription.</p>
        <div class="relative w-full h-16 bg-[#003326] rounded-2xl overflow-hidden cursor-pointer border-2 border-gray-300">
            <div id="sliderThumb" class="absolute left-0 top-0 h-full w-16 bg-[#00ff99] text-black text-4xl font-bold flex items-center justify-center rounded-2xl transition-all duration-300 select-none">
                ➜
            </div>
        </div>
    </div>
</div>
<body class="bg-[#0f0f0f] text-white font-sans">
<!-- FF Purchase Modal -->
<div id="buyFFModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden z-50">
    <div class="bg-[#1f1f1f] p-6 rounded-lg shadow-lg max-w-sm w-full">
        <h2 class="text-xl font-bold text-center mb-4">Buy Credits</h2>
        <div id="ffOptionGrid" class="grid grid-cols-2 gap-4 mb-6">
            <button class="ff-option px-4 py-3 border border-2 border-white rounded-lg text-white text-lg font-semibold hover:bg-[#505050] transition" data-value="50">50 Credits<br>$5</button>
            <button class="ff-option px-4 py-3 border border-2 border-white rounded-lg text-white text-lg font-semibold hover:bg-[#505050] transition" data-value="100">100 Credits<br>$10</button>
            <button class="ff-option px-4 py-3 border border-2 border-white rounded-lg text-white text-lg font-semibold hover:bg-[#505050] transition" data-value="250">250 Credits<br>$25</button>
            <button class="ff-option px-4 py-3 border border-2 border-white rounded-lg text-white text-lg font-semibold hover:bg-[#505050] transition" data-value="500">500 Credits<br>$50</button>
        </div>
        <div class="flex justify-end gap-4">
            <button id="cancelFFPurchase" class="px-4 py-2 bg-[#505050] font-semibold text-white rounded">Cancel</button>
            <button id="confirmFFPurchase" class="px-4 py-2 bg-[#00ff99] font-semibold text-black rounded">Continue</button>
        </div>
    </div>
</div>

<!-- Header -->
<header class="flex justify-between items-center px-6 py-4 bg-[#0f0f0f]">
    <div class="flex items-center space-x-4">
        <img src="./icons/icon48.png" alt="FloatPilot logo" class="h-8 w-8"/>
        <h1 class="text-2xl font-signature">FloatPilot</h1>
        <nav class="flex space-x-0 ml-6 text-lg">
            <a href="/" class="px-3 py-1 rounded font-medium hover:bg-[#1f1f1f] transition-ease duration-500">Home</a>
            <a href="/pricing" class="px-3 py-1 rounded font-medium hover:bg-[#1f1f1f] transition-ease duration-500">Pricing</a>
<!--            <a href="/marketplace" class="px-3 py-1 rounded font-medium hover:bg-[#1f1f1f] transition-ease duration-500">Marketplace</a>-->
            <a href="/configs" class="px-3 py-1 rounded font-medium hover:bg-[#1f1f1f] transition-ease duration-500">Configs</a>
        </nav>
    </div>

    <div class="flex items-center space-x-4">
        <!-- GitHub icon without circle -->
        <a href="https://github.com/CristiBotaAvram/floatpilot-extension" target="_blank" aria-label="GitHub" class="hover:opacity-80 transition-opacity">
            <img src="./icons/icon-github.png" alt="GitHub" class="w-6 h-6 rounded-full hover:opacity-30"/>
        </a>
        <!-- X / Twitter icon without circle -->
        <a href="https://x.com/xtiskins" target="_blank" aria-label="X (Twitter)" class="hover:opacity-80 transition-opacity ">
            <img src="./icons/icon-x.jpg" alt="X" class="w-6 h-6 rounded-full hover:opacity-30"/>
        </a>

        <!-- Not logged in -->
        <a href="/api/auth/steam" class="bg-[#000000] hover:bg-white text-white hover:text-black px-4 py-2 rounded font-semibold transition-ease duration-500" id="loginHeaderBtn">Login</a>
        <!-- Logged in -->
        <div id="userMenu" class="hidden relative">
            <button class="flex items-center space-x-3 px-3 py-1 rounded hover:bg-[#1f1f1f] transition-ease duration-500">
                <img id="avatarImg" src="" alt="avatar" class="w-6 h-6 rounded-full"/>
                <div class="flex items-center gap-2">
                    <span id="tierBadge" class="px-4 py-1 rounded-xl text-white font-extrabold text-sm border border-black shadow-md" style="text-shadow: 1px 1px 1px black;"></span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="ffBalance" class="text-white font-semibold">100 Credits</span>
                </div>
            </button>
            <div class="absolute right-0 mt-2 w-56 bg-[#0f0f0f] border border-white rounded-md shadow-lg hidden" id="userDropdown">
                <div class="px-4 py-2 border-b border-white">
                    <p id="steamName" class="font-semibold">Steam name</p>
                    <p id="steamID" class="text-[#808080] text-xs">Steam ID</p>
                </div>
                <a href="#" id="buyFFBtn" class="block px-4 py-2 font-normal hover:text-black font-semibold hover:bg-[#00ff00] transition-ease duration-500">Buy Credits</a>
                <a href="/transactions" class="block px-4 py-2 font-normal hover:text-black font-semibold hover:bg-white transition-ease duration-500">Transactions</a>
                <a href="/configs/owned" class="block px-4 py-2 font-normal hover:text-black font-semibold hover:bg-white transition-ease duration-500">Configs</a>
                <form method="POST" action="/api/logout">
                    <button type="submit" class="block w-full rounded-b-md text-left px-4 py-2 font-semibold text-[#ff0000] hover:bg-[#ff0000] hover:text-[#000000] transition-ease duration-500">Logout</button>
                </form>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="px-6 py-8">
    <h2 class="text-2xl font-bold mb-4">Browse Public Configs</h2>
    <div class="mb-4 flex justify-end">
        <a href="/configs/upload" class="bg-[#999999] hover:bg-[#00ff75] text-black font-bold py-2 px-4 rounded transition-ease duration-500">
            Upload
        </a>
    </div>

    <div class="flex justify-between items-center mb-6">
        <input type="text" placeholder="Search configs..." class="bg-[#1f1f1f] text-white px-4 py-2 rounded w-full max-w-md border border-[#333]" id="searchInput">
        <select id="sortSelect" class="ml-4 px-4 py-2 bg-[#1f1f1f] text-white border border-[#333] rounded">
            <option value="newest">Newest</option>
            <option value="popular">Most Popular</option>
            <option value="price_low">Price: Low to High</option>
            <option value="price_high">Price: High to Low</option>
        </select>
    </div>



    <div id="configGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Config cards will be injected here by JS -->
    </div>
</main>
<script>
    let currentPurchase = null;
    let currentConfigId = null;
    let currentConfigPrice = 0;
    let purchasedConfigIds = [];
    let isSliding = false;
    let startX = 0;

    document.addEventListener('DOMContentLoaded', async () => {
        const configGrid = document.getElementById('configGrid');
        const sortSelect = document.getElementById('sortSelect');
        const searchInput = document.getElementById('searchInput');
        const confirmationText = document.getElementById('confirmationText');
        const confirmationModal = document.getElementById('confirmationModal');
        const sliderThumb = document.getElementById('sliderThumb');
        const closeModal = document.getElementById('closeModal');

        let configs = [];
        let userSteamID = null;

        async function fetchConfigs() {
            try {
                const [configsRes, purchasesRes] = await Promise.all([
                    fetch('/api/configs'),
                    fetch('/api/configs/purchased', {
                        headers: {
                            'x-steamid': window.loggedInSteamID
                        }
                    })

                ]);

                const configData = await configsRes.json();
                const purchaseData = await purchasesRes.json();

                configs = configData;
                purchasedConfigIds = purchaseData.map(p => p.config_id);

                renderConfigs();
            } catch (err) {
                console.error('Failed to fetch configs or purchases:', err);
            }
        }

        function renderConfigs() {
            configGrid.innerHTML = '';
            const filtered = filterAndSort(configs);

            for (const config of filtered) {
                const isOwned = purchasedConfigIds.includes(config.id);

                const card = document.createElement('div');
                card.className = 'bg-[#181818] p-6 rounded-2xl shadow-md flex flex-col justify-between relative';

                const buttonId = `buy-${config.id}`;

                card.innerHTML = `
          <div>
            <h3 class="text-2xl font-extrabold mb-1">${config.name}</h3>
            <p class="text-sm text-gray-400 mb-3">by ${config.creator_steam_id}</p>
            <p class="text-base text-white mb-4">${config.description || 'No description.'}</p>
            <p class="text-sm text-gray-400 font-bold">${config.purchase_count} sold</p>
          </div>
          <div id="${buttonId}" class="absolute bottom-4 right-4 px-4 py-1 text-black font-bold rounded-xl text-sm ${isOwned ? 'bg-[#888]' : 'bg-[#00ff75] cursor-pointer'}">
            ${isOwned ? 'Owned' : `${config.ff_price} Credits`}
          </div>
        `;

                configGrid.appendChild(card);

                if (!isOwned) {
                    const buyButton = card.querySelector(`#${buttonId}`);
                    buyButton.addEventListener('click', () => {
                        currentPurchase = 'config';
                        currentConfigId = config.id;
                        currentConfigPrice = config.ff_price;
                        confirmationText.textContent = `Slide to confirm purchase of \"${config.name}\" for ${config.ff_price} Credits.`;
                        confirmationModal.classList.remove('hidden');
                        sliderThumb.style.left = '0';
                    });
                }
            }
        }

        function filterAndSort(configs) {
            const search = searchInput.value.toLowerCase();
            let result = configs.filter(c =>
                c.name.toLowerCase().includes(search) ||
                (c.description && c.description.toLowerCase().includes(search))
            );

            const sort = sortSelect.value;
            if (sort === 'price_low') result.sort((a, b) => a.ff_price - b.ff_price);
            else if (sort === 'price_high') result.sort((a, b) => b.ff_price - a.ff_price);
            else if (sort === 'popular') result.sort((a, b) => b.purchase_count - a.purchase_count);
            else result.sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());

            return result;
        }

        sortSelect.addEventListener('change', renderConfigs);
        searchInput.addEventListener('input', renderConfigs);
        closeModal.addEventListener('click', () => confirmationModal.classList.add('hidden'));


        const ffBalance = document.getElementById('ffBalance');
        fetch('/api/me')
            .then(r => r.json())
            .then(data => {
                if (data.loggedIn) {
                    document.getElementById('loginHeaderBtn')?.classList.add('hidden');
                    document.getElementById('userMenu')?.classList.remove('hidden');
                    document.getElementById('avatarImg').src = data.avatarUrl;
                    document.getElementById('steamName').textContent = data.displayName;
                    document.getElementById('steamID').textContent = data.steamID64;
                    ffBalance.textContent = `${data.ff_balance || 0} Credits`;

                    const tier = data.tier || 'Free';
                    let tierColor = '#848884';
                    if (tier === 'Pro') tierColor = '#0068ff';

                    const tierBadge = document.getElementById('tierBadge');
                    tierBadge.textContent = tier;
                    tierBadge.style.backgroundColor = tierColor;
                    tierBadge.style.color = '#000';
                    tierBadge.style.fontWeight = 'bold';
                } else {
                    document.getElementById('loginHeaderBtn')?.classList.remove('hidden');
                    document.getElementById('userMenu')?.classList.add('hidden');
                }

                window.loggedInSteamID = data.steamID64;
                fetchConfigs();
            });

        document.getElementById('userMenu')?.addEventListener('click', (event) => {
            event.stopPropagation();
            document.getElementById('userDropdown')?.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('userDropdown');
            const menu = document.getElementById('userMenu');
            if (dropdown && !dropdown.classList.contains('hidden') && !menu.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
        closeModal.addEventListener('click', () => confirmationModal.classList.add('hidden'));
        sliderThumb.addEventListener('mousedown', e => { isSliding = true; startX = e.clientX });
        document.addEventListener('mousemove', e => {
            if (!isSliding) return;
            const slider = sliderThumb.parentElement;
            const delta = Math.min(Math.max(0, e.clientX - startX), slider.offsetWidth - sliderThumb.offsetWidth);
            sliderThumb.style.left = `${delta}px`;
        });
        document.addEventListener('mouseup', async e => {
            if (!isSliding) return;
            isSliding = false;
            const slider = sliderThumb.parentElement;

            const completedSlide = parseInt(sliderThumb.style.left) >= slider.offsetWidth - sliderThumb.offsetWidth - 10;
            if (!completedSlide) {
                sliderThumb.style.left = '0';
                return;
            }

            sliderThumb.style.left = `${slider.offsetWidth - sliderThumb.offsetWidth}px`;
            confirmationModal.classList.add('hidden');

            if (currentPurchase === 'config') {
                const res = await fetch('/api/configs/purchase', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        config_id: currentConfigId,
                        cost: currentConfigPrice
                    })
                });

                const json = await res.json();
                if (json.success) {
                    purchasedConfigIds.push(currentConfigId);
                    renderConfigs();
                } else {
                    alert(`Purchase failed: ${json.error || 'Unknown error'}`);
                }
            }
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const buyFFBtn = document.getElementById('buyFFBtn');
        const buyFFModal = document.getElementById('buyFFModal');
        const cancelBtn = document.getElementById('cancelFFPurchase');
        const confirmBtn = document.getElementById('confirmFFPurchase');
        const ffOptions = document.querySelectorAll('.ff-option');
        let selectedAmount = null;

        buyFFBtn?.addEventListener('click', () => {
            buyFFModal.classList.remove('hidden');
        });

        cancelBtn?.addEventListener('click', () => {
            buyFFModal.classList.add('hidden');
            ffOptions.forEach(btn => btn.classList.remove('border-[#00ff99]'));
            selectedAmount = null;
        });

        ffOptions.forEach(button => {
            button.addEventListener('click', () => {
                ffOptions.forEach(btn => btn.classList.remove('border-[#00ff99]'));
                button.classList.add('border-[#00ff99]');
                selectedAmount = parseInt(button.dataset.value);
            });
        });

        confirmBtn?.addEventListener('click', async () => {
            const steamID = document.getElementById('steamID')?.textContent;
            if (!steamID || !selectedAmount) return alert('Missing Steam ID or Credits amount');

            try {
                const res = await fetch('/api/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ steamId: steamID, ffAmount: selectedAmount })
                });

                const { url } = await res.json();
                if (url) window.location.href = url;
                else alert('Failed to create Stripe checkout session.');
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });
    });
</script>
</body>
</html>
