<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owned configs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Background polish */
        .bg-grid{background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);background-size:26px 26px}
        .radial-spot{background:radial-gradient(2000px 1000px at 50% -10%,rgba(0,104,255,.18),transparent 60%),radial-gradient(1600px 800px at 10% 110%,rgba(0,255,153,.09),transparent 60%)}
        /* Glass cards */
        .glass{background:rgba(15,16,20,.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
        .modal-card{background:rgba(17,18,20,.92);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.5)}
    </style>
</head>

<!-- Confirmation Modal (present but unused by default — still keeping id/structure) -->
<div id="confirmationModal" class="fixed inset-0 backdrop-blur-sm bg-black/70 flex items-center justify-center hidden z-50 p-4">
    <div class="relative modal-card p-6 rounded-2xl w-full max-w-md text-center">
        <button id="closeModal" class="absolute top-3 left-3 text-white/80 text-lg font-bold hover:text-white transition">✕</button>
        <h2 class="text-2xl font-extrabold mb-2 tracking-tight">Confirm</h2>
        <p id="confirmationText" class="mb-5 text-white/70">Slide to confirm.</p>
        <div class="relative w-full h-16 bg-[#001f4d] rounded-2xl overflow-hidden cursor-pointer border border-white/10 ring-1 ring-white/10">
            <div id="sliderThumb" class="absolute left-0 top-0 h-full w-16 bg-[#0068ff] text-black text-4xl font-bold flex items-center justify-center rounded-2xl transition-all duration-300 select-none shadow-lg">➜</div>
        </div>
    </div>
</div>

<body class="bg-[#0f0f0f] text-white font-sans bg-grid radial-spot min-h-screen">

<!-- FF Purchase Modal -->
<div id="buyFFModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="modal-card p-6 rounded-2xl max-w-sm w-full">
        <h2 class="text-2xl font-extrabold text-center mb-4 tracking-tight">Buy Credits</h2>
        <div id="ffOptionGrid" class="grid grid-cols-2 gap-3 mb-6">
            <button class="ff-option px-4 py-4 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 transition shadow-sm text-left font-semibold" data-value="50">
                <span class="block text-base">50 Credits</span>
                <span class="block text-white/70 text-sm">$5</span>
            </button>
            <button class="ff-option px-4 py-4 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 transition shadow-sm text-left font-semibold" data-value="100">
                <span class="block text-base">100 Credits</span>
                <span class="block text-white/70 text-sm">$10</span>
            </button>
            <button class="ff-option px-4 py-4 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 transition shadow-sm text-left font-semibold" data-value="250">
                <span class="block text-base">250 Credits</span>
                <span class="block text-white/70 text-sm">$25</span>
            </button>
            <button class="ff-option px-4 py-4 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 transition shadow-sm text-left font-semibold" data-value="500">
                <span class="block text-base">500 Credits</span>
                <span class="block text-white/70 text-sm">$50</span>
            </button>
        </div>
        <div class="flex justify-end gap-3">
            <button id="cancelFFPurchase" class="px-4 py-2 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 transition font-semibold">Cancel</button>
            <button id="confirmFFPurchase" class="px-4 py-2 rounded-lg bg-[#0068ff] hover:brightness-110 text-black font-extrabold shadow-md">Continue</button>
        </div>
    </div>
</div>

<!-- Header -->
<header class="sticky top-0 z-40 border-b border-white/10 bg-[#0f0f0f]/70 backdrop-blur supports-[backdrop-filter]:bg-[#0f0f0f]/50">
    <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">
        <div class="flex items-center space-x-4">
            <img src="../../icons/icon48.png" alt="FloatPilot logo" class="h-8 w-8"/>
            <h1 class="text-2xl font-extrabold tracking-tight">FloatPilot</h1>
            <nav class="hidden sm:flex space-x-1 ml-4 text-sm">
                <a href="/" class="px-3 py-2 rounded-lg text-lg font-semibold hover:bg-white/5 transition">Home</a>
                <a href="/pricing" class="px-3 py-2 rounded-lg text-lg font-semibold hover:bg-white/5 transition">Pricing</a>
                <a href="/configs" class="px-3 py-2 rounded-lg text-lg font-semibold hover:bg-white/5 transition">Configs</a>
            </nav>
        </div>

        <div class="flex items-center space-x-3">
            <a href="https://www.youtube.com/@xtiskins" target="_blank" aria-label="YouTube" class="opacity-80 hover:opacity-100 transition">
                <img src="../../icons/icon-youtube.png" alt="YouTube" class="w-7 h-5 rounded"/>
            </a>
            <a href="https://x.com/xtiskins" target="_blank" aria-label="X (Twitter)" class="opacity-80 hover:opacity-100 transition">
                <img src="../../icons/icon-x.jpg" alt="X" class="w-6 h-6 rounded-full"/>
            </a>

            <!-- Not logged in -->
            <a href="/api/auth/steam" class="hidden items-center gap-2 bg-black border border-white/10 hover:bg-white hover:text-black px-4 py-2 rounded-lg font-semibold transition-ease duration-500" id="loginHeaderBtn">Login</a>
            <!-- Logged in -->
            <div id="userMenu" class="hidden relative">
                <button class="flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-white/5 transition-ease duration-500">
                    <img id="avatarImg" src="" alt="avatar" class="w-7 h-7 rounded-full"/>
                    <span id="tierBadge" class="px-3 py-1 rounded-lg text-white text-xs border border-black/40 shadow-md"></span>
                    <span id="ffBalance" class="text-white font-semibold hidden md:inline">100 Credits</span>
                    <svg class="w-4 h-4 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
                <div class="absolute right-0 mt-2 w-64 glass rounded-xl shadow-2xl hidden overflow-hidden" id="userDropdown">
                    <div class="px-4 py-3 border-b border-white/10">
                        <p id="steamName" class="font-semibold">Steam name</p>
                        <p id="steamID" class="text-white/60 text-xs">Steam ID</p>
                    </div>
                    <a href="#" id="buyFFBtn" class="block px-4 py-2 hover:bg-[#0068ff] hover:text-black transition font-semibold">Buy Credits</a>
                    <a href="/transactions" class="block px-4 py-2 hover:bg-white hover:text-black transition font-semibold">Transactions</a>
                    <a href="/configs/owned" class="block px-4 py-2 hover:bg-white hover:text-black transition font-semibold">Configs</a>
                    <form method="POST" action="/api/logout">
                        <button type="submit" class="block w-full text-left px-4 py-2 font-semibold text-[#ff5b5b] hover:bg-[#ff5b5b] hover:text-black transition">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-3xl font-extrabold tracking-tight">Your Owned Configs</h2>
        <a href="/configs" class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-[#0068ff] to-[#00b3ff] px-4 py-2 font-extrabold text-black shadow-lg hover:brightness-110 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/60 transition">Browse more</a>
    </div>

    <!-- Grid -->
    <div id="ownedGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Skeletons shown initially and removed when data loads -->
        <div class="glass rounded-2xl p-6 animate-pulse">
            <div class="h-6 w-40 bg-white/10 rounded mb-2"></div>
            <div class="h-4 w-24 bg-white/10 rounded mb-4"></div>
            <div class="h-4 w-full bg-white/10 rounded mb-2"></div>
            <div class="h-4 w-3/4 bg-white/10 rounded"></div>
        </div>
        <div class="glass rounded-2xl p-6 animate-pulse hidden sm:block">
            <div class="h-6 w-40 bg:white/10 rounded mb-2"></div>
            <div class="h-4 w-24 bg:white/10 rounded mb-4"></div>
            <div class="h-4 w-full bg:white/10 rounded mb-2"></div>
            <div class="h-4 w-3/4 bg:white/10 rounded"></div>
        </div>
        <div class="glass rounded-2xl p-6 animate-pulse hidden lg:block">
            <div class="h-6 w-40 bg:white/10 rounded mb-2"></div>
            <div class="h-4 w-24 bg:white/10 rounded mb-4"></div>
            <div class="h-4 w-full bg:white/10 rounded mb-2"></div>
            <div class="h-4 w-3/4 bg:white/10 rounded"></div>
        </div>
    </div>

    <div id="emptyMsg" class="hidden text-white/70 text-center py-10">
        <div class="mx-auto mb-3 h-9 w-9 rounded-full bg-white/10 flex items-center justify-center">📄</div>
        <p>You do not own any configs yet.</p>
    </div>
</main>

<footer class="text-center text-white/60 text-sm mt-12 mb-6">&copy; 2025 FloatPilot. All rights reserved.</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const ffBalance = document.getElementById('ffBalance');

        fetch('/api/me')
            .then(r => r.json())
            .then(data => {
                if (data.loggedIn) {
                    document.getElementById('loginHeaderBtn')?.classList.add('hidden');
                    document.getElementById('userMenu')?.classList.remove('hidden');
                    document.getElementById('avatarImg').src = data.avatarUrl;
                    document.getElementById('steamName').textContent = data.displayName;
                    document.getElementById('steamID').textContent = data.steamID64;
                    ffBalance.textContent = `${data.ff_balance || 0} Credits`;

                    const tier = data.tier || 'Free';
                    let tierColor = '#848884';
                    if (tier === 'Pro') tierColor = '#0068ff';

                    const tierBadge = document.getElementById('tierBadge');
                    tierBadge.textContent = tier;
                    tierBadge.style.backgroundColor = tierColor;
                    tierBadge.style.color = '#000';
                    tierBadge.style.fontWeight = 'bold';
                } else {
                    document.getElementById('loginHeaderBtn')?.classList.remove('hidden');
                    document.getElementById('userMenu')?.classList.add('hidden');
                }
            });

        document.getElementById('userMenu')?.addEventListener('click', (event) => {
            event.stopPropagation();
            document.getElementById('userDropdown')?.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('userDropdown');
            const menu = document.getElementById('userMenu');
            if (dropdown && !dropdown.classList.contains('hidden') && !menu.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
    });
</script>
<script>
    function setSteamIDAndFetchConfigs() {
        fetch('/api/me')
            .then(r => r.json())
            .then(data => {
                window.loggedInSteamID = data.steamID64;
                fetchOwnedConfigs();
            });
    }

    async function fetchOwnedConfigs() {
        const ownedGrid = document.getElementById('ownedGrid');
        // clear skeletons if any
        ownedGrid.innerHTML = '';

        if (!window.loggedInSteamID) {
            ownedGrid.innerHTML = '<p class="text-white/70 p-4">Please log in to see your owned configs.</p>';
            return;
        }
        try {
            const purchasesRes = await fetch('/api/configs/purchased', { headers: { 'x-steamid': window.loggedInSteamID } });
            const purchaseData = await purchasesRes.json();
            const ownedIds = Array.isArray(purchaseData) ? purchaseData.map(p => p.config_id) : [];

            if (!ownedIds.length) {
                document.getElementById('emptyMsg')?.classList.remove('hidden');
                return;
            }

            const configsRes = await fetch('/api/configs?ids=' + ownedIds.join(','));
            const configs = await configsRes.json();

            renderOwnedConfigs(configs, window.loggedInSteamID);
        } catch (err) {
            console.error('Failed to fetch owned configs:', err);
            ownedGrid.innerHTML = '<p class="text-red-400 p-4">Failed to load owned configs.</p>';
        }
    }

    function renderOwnedConfigs(configs, steamID) {
        const ownedGrid = document.getElementById('ownedGrid');
        ownedGrid.innerHTML = '';

        for (const config of configs) {
            const card = document.createElement('div');
            card.className = 'glass p-6 rounded-2xl shadow-xl flex flex-col justify-between relative';

            let deleteButtonHTML = '';
            if (config.creator_steam_id === steamID && config.is_private) {
                deleteButtonHTML = `
            <button class="absolute top-4 right-4 text-xs px-3 py-1 rounded bg-rose-500/90 hover:bg-rose-400 text-black font-bold shadow" onclick="deleteConfig('${config.id}')">Delete</button>
          `;
            }

            card.innerHTML = `
          ${deleteButtonHTML}
          <div>
            <h3 class="text-xl font-extrabold mb-1 leading-tight">${config.name}</h3>
            <p class="text-xs text-white/50 mb-3">by ${config.creator_steam_id}</p>
            <p class="text-sm text-white/90 mb-4">${config.description || 'No description.'}</p>
            <div class="flex items-center gap-3">
              <span class="text-xs text-white/60">${config.purchase_count} sold</span>
              <span class="px-3 py-1 rounded-lg text-xs bg-white/10 border border-white/15 text-white/80">Owned</span>
            </div>
          </div>
        `;
            ownedGrid.appendChild(card);
        }
    }

    async function deleteConfig(configId) {
        const confirmed = confirm('Are you sure you want to delete this config?');
        if (!confirmed) return;

        const res = await fetch('/api/configs/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-steamid': window.loggedInSteamID },
            body: JSON.stringify({ config_id: configId })
        });

        const json = await res.json();
        if (json.success) {
            alert('Config deleted.');
            fetchOwnedConfigs();
        } else {
            alert('Delete failed: ' + (json.error || 'Unknown error'));
        }
    }

    document.addEventListener('DOMContentLoaded', setSteamIDAndFetchConfigs);
</script>
<script>
    // --------- Buy credits modal (unchanged) ---------
    document.addEventListener('DOMContentLoaded', () => {
        const buyFFBtn = document.getElementById('buyFFBtn');
        const buyFFModal = document.getElementById('buyFFModal');
        const cancelBtn = document.getElementById('cancelFFPurchase');
        const confirmBtn = document.getElementById('confirmFFPurchase');
        const ffOptions = document.querySelectorAll('.ff-option');
        let selectedAmount = null;

        buyFFBtn?.addEventListener('click', () => { buyFFModal.classList.remove('hidden'); });
        cancelBtn?.addEventListener('click', () => {
            buyFFModal.classList.add('hidden');
            ffOptions.forEach(btn => btn.classList.remove('ring-2','ring-[#00ff99]','border-[#00ff99]'));
            selectedAmount = null;
        });

        ffOptions.forEach(button => {
            button.addEventListener('click', () => {
                ffOptions.forEach(btn => btn.classList.remove('ring-2','ring-[#00ff99]','border-[#00ff99]'));
                button.classList.add('ring-2','ring-[#00ff99]');
                selectedAmount = parseInt(button.dataset.value);
            });
        });

        confirmBtn?.addEventListener('click', async () => {
            const steamID = document.getElementById('steamID')?.textContent;
            if (!steamID || !selectedAmount) return alert('Missing Steam ID or Credits amount');

            try {
                const res = await fetch('/api/create-checkout-session', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ steamId: steamID, ffAmount: selectedAmount })
                });
                const { url } = await res.json();
                if (url) window.location.href = url; else alert('Failed to create Stripe checkout session.');
            } catch (err) { alert('Error: ' + err.message); }
        });
    });
</script>
</body>
</html>
