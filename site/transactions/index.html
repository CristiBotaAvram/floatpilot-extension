<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Transactions – FloatPilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-white font-sans">
<header class="flex justify-between items-center px-6 py-4 bg-[#0f0f0f] border-b border-white">
    <h1 class="text-xl font-bold">Transaction History</h1>
    <a href="/" class="text-blue-400 hover:underline">← Back to Dashboard</a>
</header>

<main class="max-w-5xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-semibold mb-6">Your Transactions</h2>
    <div class="overflow-x-auto">
        <table class="min-w-full border border-white rounded">
            <thead class="bg-[#1a1a1a]">
            <tr>
                <th class="px-4 py-2 border border-white text-left">Date</th>
                <th class="px-4 py-2 border border-white text-left">Type</th>
                <th class="px-4 py-2 border border-white text-left">FF Change</th>
            </tr>
            </thead>
            <tbody id="transactionsBody">
            <!-- Transactions will be inserted here -->
            </tbody>
        </table>
    </div>
    <p id="emptyMsg" class="text-gray-400 mt-6 hidden">No transactions found.</p>
</main>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const tbody = document.getElementById('transactionsBody');
        const emptyMsg = document.getElementById('emptyMsg');

        try {
            const res = await fetch('/api/transactions');
            const json = await res.json();
            const transactions = json?.transactions || [];

            if (transactions.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }

            transactions.forEach(tx => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-[#1f1f1f] transition';

                row.innerHTML = `
            <td class="px-4 py-2 border border-white">${new Date(tx.created_at).toLocaleString()}</td>
            <td class="px-4 py-2 border border-white text-blue-300">${tx.type}</td>
            <td class="px-4 py-2 border border-white text-${tx.amount > 0 ? 'green' : 'red'}-400 font-semibold">${tx.amount > 0 ? '+' : ''}${tx.amount}</td>
          `;
                tbody.appendChild(row);
            });
        } catch (err) {
            console.error('Error fetching transactions:', err);
            emptyMsg.textContent = 'Error loading transactions.';
            emptyMsg.classList.remove('hidden');
        }
    });
</script>
</body>
</html>
