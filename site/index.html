<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FloatPilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

<!-- Header -->
<header class="flex justify-between items-center px-6 py-4 border-b border-gray-700 bg-gray-800">
    <div class="flex items-center space-x-4">
        <img src="/plane-icon.png" alt="FloatPilot logo" class="h-8 w-8"/>
        <h1 class="text-2xl font-signature">FloatPilot</h1>
        <nav class="flex space-x-6 ml-6 text-lg">
            <a href="#" class="hover:text-blue-400">Home</a>
            <a href="#" class="hover:text-blue-400">Pricing</a>
            <a href="#" class="hover:text-blue-400">Marketplace</a>
            <a href="#" class="hover:text-blue-400">Configs</a>
        </nav>
    </div>

    <div class="flex items-center space-x-2">
        <a href="https://github.com" target="_blank" class="bg-black rounded-full p-2">
            <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub" class="w-4 h-4"/>
        </a>
        <button class="bg-black text-white font-bold rounded-full w-8 h-8 flex items-center justify-center">X</button>

        <!-- Not logged in -->
        <a id="loginBtn" href="/api/auth/steam" class="ml-2 bg-white text-black font-semibold px-4 py-1 rounded hidden">Sign in</a>

        <!-- Logged in -->
        <div id="userMenu" class="hidden relative">
            <button class="flex items-center space-x-3 px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">
                <img id="avatarImg" src="" alt="avatar" class="w-6 h-6 rounded-full"/>
                <div class="flex items-center gap-2">
                    <span id="ffBalance" class="text-blue-400 font-semibold">100 FF</span>
                    <span id="tierBadge" class="text-xs px-2 py-0.5 rounded font-semibold"></span>
                </div>
            </button>
            <div class="absolute right-0 mt-2 w-56 bg-gray-800 border border-gray-700 rounded-md shadow-lg hidden" id="userDropdown">
                <div class="px-4 py-2 border-b border-gray-700">
                    <p id="steamName" class="font-semibold">Steam name</p>
                    <p id="steamID" class="text-gray-400 text-xs">SteamID</p>
                    <p id="userTier" class="text-sm text-yellow-400 mt-1">Tier</p>
                </div>
                <a href="#" class="block px-4 py-2 hover:bg-gray-700">Orders</a>
                <a href="#" class="block px-4 py-2 hover:bg-gray-700">Configs</a>
            </div>
        </div>
    </div>
</header>

<!-- Main -->
<main class="max-w-4xl mx-auto px-4 py-8">
    <!-- Unchanged content -->
</main>

<!-- Footer -->
<footer class="text-center text-gray-500 text-sm mt-12 mb-4">
    &copy; 2025 FloatPilot. All rights reserved.
</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginBtn     = document.getElementById('loginBtn')
        const userMenu     = document.getElementById('userMenu')
        const avatarImg    = document.getElementById('avatarImg')
        const steamName    = document.getElementById('steamName')
        const steamID      = document.getElementById('steamID')
        const ffBalance    = document.getElementById('ffBalance')
        const userTier     = document.getElementById('userTier')
        const tierBadge    = document.getElementById('tierBadge')
        const userDropdown = document.getElementById('userDropdown')

        let currentFF = 0

        fetch('/api/me')
            .then(r => r.json())
            .then(data => {
                if (data.loggedIn) {
                    loginBtn.classList.add('hidden')
                    userMenu.classList.remove('hidden')
                    avatarImg.src         = data.avatarUrl
                    steamName.textContent = data.displayName
                    steamID.textContent   = data.steamId
                    userTier.textContent  = data.tier || 'Cadet'
                    currentFF             = data.ff_balance || 0
                    ffBalance.textContent = `${currentFF} FF`

                    tierBadge.textContent = data.tier || 'Cadet'
                    tierBadge.className = `text-xs px-2 py-0.5 rounded font-semibold ${data.tierStyle}`

                    document.querySelectorAll('[data-tier]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const newTier = btn.dataset.tier
                            const cost = newTier === 'Commander' ? 500 : newTier === 'Co-Pilot' ? 150 : 0

                            if (currentFF < cost) {
                                alert(`You need ${cost} FF to subscribe to ${newTier}.`)
                                return
                            }

                            const res = await fetch('/api/me', {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ tier: newTier })
                            })
                            const json = await res.json()
                            if (json.success) {
                                location.reload()
                            } else {
                                alert('Subscription failed.')
                            }
                        })
                    })
                } else {
                    loginBtn.classList.remove('hidden')
                    userMenu.classList.add('hidden')
                }
            })
            .catch(console.error)

        userMenu?.addEventListener('click', () => {
            userDropdown.classList.toggle('hidden')
        })
    })
</script>

</body>
</html>
